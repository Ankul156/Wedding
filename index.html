<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
    }

    /* CARD */
    .card {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      padding: 26px 20px;
      border-radius: 28px;
      background: url("images/rm119batch4-adj-20-leavesframe.jpg") center/cover no-repeat;
      box-shadow: 0 25px 60px rgba(0, 0, 0, .35);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, .22);
    }

    .card-content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    /* TEXT */
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: #4b1d6b;
    }

    .subtitle {
      font-size: 13px;
      margin-bottom: 8px;
    }

    .names-ring {
      width: 140px;
      height: 140px;
      margin: 10px auto;
      border-radius: 50%;
      border: 3px solid #b18ae0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .names {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: #5a2d82;
    }

    .date strong {
      display: block;
      font-size: 28px;
      color: #6f2cff;
    }

    .venue {
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* BUTTONS */
    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .btn {
      width: 210px;
      height: 44px;
      border-radius: 22px;
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .25);
    }

    .home {
      background: linear-gradient(135deg, #4facfe, #7d3cff)
    }

    .wedding {
      background: linear-gradient(135deg, #ff6fb1, #b83280)
    }

    .rsvp {
      background: linear-gradient(135deg, #28c76f, #1e9f5b)
    }

    .functions {
      background: linear-gradient(135deg, #ffa726, #fb8c00)
    }

    .btn:hover {
      transform: translateY(-2px)
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
    }

    .modal-box {
      background: #fff;
      width: 92%;
      max-width: 380px;
      padding: 24px;
      border-radius: 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, .4);
    }

    /* RSVP */
    .modal-box h3 {
      text-align: center;
      margin-bottom: 14px;
      font-size: 22px;
      color: #4b1d6b;
    }

    .rsvp-label {
      font-size: 13px;
      margin-bottom: 6px;
      color: #444;
    }

    .rsvp-input {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #ddd;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .rsvp-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }

    .rsvp-option {
      border: 2px solid #e0e0e0;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: .3s;
    }

    .rsvp-option input {
      display: none
    }

    .rsvp-option span {
      font-size: 14px;
      font-weight: 500;
    }

    .rsvp-option.attend {
      border-color: #28c76f
    }

    .rsvp-option.not-attend {
      border-color: #ff5252
    }

    .rsvp-option input:checked+span {
      color: #fff;
    }

    .rsvp-option.attend input:checked+span {
      background: #28c76f;
      padding: 6px 10px;
      border-radius: 12px;
    }

    .rsvp-option.not-attend input:checked+span {
      background: #ff5252;
      padding: 6px 10px;
      border-radius: 12px;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .close {
      background: #e0e0e0;
      color: #000;
      width: 100%;
      height: 42px;
      border-radius: 18px;
      border: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card" data-aos="zoom-in">
    <div class="card-content">

      <div class="title">Wedding Invitation</div>
      <div class="subtitle">With great joy, we invite you</div>

      <div class="names-ring">
        <div class="names">Pooja<br>&<br>Yogendra</div>
      </div>

      <div class="date"><strong>10</strong> February 2026 · Tuesday</div>

      <div class="venue">
        Kishan Mahal Marriage Garden<br>Jaipur
      </div>

      <div class="buttons">
        <a class="btn home" href="#" target="_blank">🏠 Home Location</a>
        <a class="btn wedding" href="#" target="_blank">💒 Wedding Venue</a>
        <button class="btn functions">🎉 Functions</button>
        <button class="btn rsvp" onclick="openRSVP()">📩 RSVP</button>
      </div>

    </div>
  </div>

  <!-- RSVP MODAL -->
  <div class="modal" id="rsvpModal">
    <div class="modal-box">
      <h3>RSVP Confirmation</h3>

      <div class="rsvp-label">Guest Name</div>
      <input class="rsvp-input" type="text" id="guestName" placeholder="Enter your name">

      <div class="rsvp-options">
        <label class="rsvp-option attend">
          <input type="radio" name="response" value="I will attend">
          <span>✅ I will attend</span>
        </label>

        <label class="rsvp-option not-attend">
          <input type="radio" name="response" value="Sorry, I can’t attend">
          <span>❌ Sorry, I can’t attend</span>
        </label>
      </div>

      <div class="modal-actions">
        <button class="btn rsvp" onclick="sendRSVP()">Send via WhatsApp</button>
        <button class="close" onclick="closeRSVP()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 900, once: true });

    function openRSVP() { document.getElementById("rsvpModal").style.display = "flex" }
    function closeRSVP() { document.getElementById("rsvpModal").style.display = "none" }

    function sendRSVP() {
      const name = document.getElementById("guestName").value.trim();
      const res = document.querySelector('input[name="response"]:checked');
      if (!name || !res) { alert("Please enter name and select response"); return; }
      window.open(`https://wa.me/91XXXXXXXXXX?text=RSVP%0AName: ${name}%0A${res.value}`, "_blank");
      closeRSVP();
    }
  </script>

</body>

</html>
