<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
    }

    .card {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      padding: 26px 20px;
      border-radius: 28px;
      background: url("images/rm119batch4-adj-20-leavesframe.jpg") center/cover no-repeat;
      box-shadow: 0 25px 60px rgba(0, 0, 0, .35);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, .22);
    }

    .card-content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 35px;
      color: #4b1d6b;
    }

    .subtitle { font-size: 13px; margin-bottom: 8px; }

    .names-ring {
      width: 140px;
      height: 140px;
      margin: 10px auto;
      border-radius: 50%;
      border: 3px solid #b18ae0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .names {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: #5a2d82;
    }

    .date strong {
      display: block;
      font-size: 28px;
      color: #6f2cff;
    }

    .venue { font-size: 13px; margin-bottom: 14px; }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .btn {
      width: 210px;
      height: 44px;
      border-radius: 22px;
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .25);
      transition: 0.2s;
    }

    .home { background: linear-gradient(135deg, #4facfe, #7d3cff); }
    .wedding { background: linear-gradient(135deg, #ff6fb1, #b83280); }
    .rsvp { background: linear-gradient(135deg, #28c76f, #1e9f5b); }
    .functions { background: linear-gradient(135deg, #ffa726, #fb8c00); }

    .btn:hover { transform: translateY(-2px) scale(1.02); }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
    }

    .modal-box {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      width: 92%;
      max-width: 380px;
      padding: 28px 22px;
      border-radius: 26px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, .45);
      text-align: center;
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateY(-40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-box h3 {
      font-size: 24px;
      margin-bottom: 6px;
      color: #4b1d6b;
    }

    .rsvp-sub {
      font-size: 13px;
      color: #555;
      margin-bottom: 18px;
    }

    #guestName {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid #ddd;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
    }

    #guestName:focus {
      border-color: #6f2cff;
      box-shadow: 0 0 0 3px rgba(111,44,255,.15);
    }

    .response-options {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .response-btn {
      flex: 1;
      padding: 14px 0;
      border-radius: 18px;
      border: none;
      font-size: 14px;
      color: #fff;
      cursor: pointer;
      transition: 0.25s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .response-yes { background: linear-gradient(135deg, #28c76f, #1e9f5b); }
    .response-no { background: linear-gradient(135deg, #f44336, #d32f2f); }

    /* ===== ENHANCED SELECTED STATE (ONLY CHANGE) ===== */
    .response-btn.selected {
      transform: scale(1.1);
      border: 2px solid #fff;
      animation: pulseGlow 0.8s ease-in-out infinite alternate;
    }

    .response-yes.selected {
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.9),
        0 0 22px rgba(40,199,111,0.85);
    }

    .response-no.selected {
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.9),
        0 0 22px rgba(244,67,54,0.85);
    }

    @keyframes pulseGlow {
      from { transform: scale(1.08); }
      to { transform: scale(1.12); }
    }
    /* ================================================ */

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .close {
      background: #e0e0e0;
      color: #000;
      height: 42px;
      border-radius: 18px;
      border: none;
      cursor: pointer;
    }

    .success-msg {
      display: none;
      font-size: 15px;
      color: #1e9f5b;
      margin-top: 10px;
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>

  <div class="card" data-aos="zoom-in">
    <div class="card-content">
      <div class="title">Wedding Invitation</div>
      <div class="subtitle">With great joy, we invite you to Wedding of</div>

      <div class="names-ring">
        <div class="names">Pooja<br>&<br>Yogendra <span style="font-size:15px;">(Arvind)</span></div>
      </div>

      <div class="date"><strong>10</strong> February 2026 · Tuesday</div>
      <div class="venue">Kishan Mahal Marriage Garden<br>Jaipur</div>

      <div class="buttons">
        <a class="btn home" href="https://maps.app.goo.gl/cGW3LajMyvQ7akE9A" target="_blank">🏠 Home Location</a>
        <a class="btn wedding" href="https://maps.app.goo.gl/BaM9XXX9yfv6Xo339" target="_blank">💒 Wedding Venue</a>
        <button class="btn functions">🎉 Functions</button>
        <button class="btn rsvp" onclick="openRSVP()">📩 RSVP</button>
      </div>
    </div>
  </div>

  <!-- RSVP MODAL -->
  <div class="modal" id="rsvpModal">
    <div class="modal-box">
      <h3>💌 RSVP</h3>
      <div class="rsvp-sub">We’d love to know if you can join us</div>

      <input type="text" id="guestName" placeholder="Your Name">

      <div class="response-options">
        <button class="response-btn response-yes" data-value="Will attend">✅ Attend</button>
        <button class="response-btn response-no" data-value="Will not attend">❌ Can't</button>
      </div>

      <div class="modal-actions">
        <button class="btn rsvp" onclick="sendRSVP()">Send via WhatsApp</button>
        <button class="close" onclick="closeRSVP()">Cancel</button>
      </div>

      <div class="success-msg" id="successMsg">✨ Thank you for your response!</div>
    </div>
  </div>

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 900, once: true });

    const rsvpModal = document.getElementById("rsvpModal");
    let selectedResponse = null;

    function openRSVP() { rsvpModal.style.display = "flex"; }
    function closeRSVP() {
      rsvpModal.style.display = "none";
      selectedResponse = null;
      resetResponseButtons();
      document.getElementById("successMsg").style.display = "none";
    }

    const responseButtons = document.querySelectorAll(".response-btn");
    responseButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        selectedResponse = btn.getAttribute("data-value");
        resetResponseButtons();
        btn.classList.add("selected");
      });
    });

    function resetResponseButtons() {
      responseButtons.forEach(btn => btn.classList.remove("selected"));
    }

    function sendRSVP() {
      const name = document.getElementById("guestName").value.trim();
      if (!name || !selectedResponse) {
        alert("Please enter your name and select a response");
        return;
      }

      const phone = "916377932489";
      const message = encodeURIComponent(`RSVP\nName: ${name}\nResponse: ${selectedResponse}`);
      window.open(`https://wa.me/${phone}?text=${message}`, "_blank");

      document.getElementById("successMsg").style.display = "block";
      setTimeout(closeRSVP, 1200);
    }
  </script>
</body>
</html>
